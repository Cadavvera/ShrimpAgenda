<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ava Kot">
    <title>Contact Us</title>

    <!-- STYLE SHEET LINKS -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/styles_contact.css">

    <!-- GOOGLE FONTS LINK -->
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Electrolize&display=swap" rel="stylesheet">
</head>
<body>
    
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="gallery.html">Gallery</a>
            <a href="tank.html">Tank</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <!-- Title -->
    <h1 class="big-title">JOIN THE AGENDA</h1>

    <!-- Shrimp Line -->
    <section class="shrimp">
        <img src="images/1_Cherry_Shrimp.png" alt="A pixel art image of a red shrimp.">
        <img src="images/2_Blue_Dream.png" alt="A pixel art image of a dark blue shrimp.">
        <img src="images/3_Orange_Pumpkin.png" alt="A pixel art image of an orange shrimp.">
        <img src="images/4_Amano.png" alt="A pixel art image of a white and black striped shrimp.">
        <img src="images/5_Yellow_Golden_Back.png" alt="A pixel art image of a yellow shrimp with golden stripe on its back.">
        <img src="images/6_Green_Jade.png" alt="A pixel art image of a dark green shrimp.">
        <img src="images/7_Bloody_Mary.png" alt="A pixel art image of a intensly red shrimp">
        <img src="images/8_Crystal_red.png" alt="A pixel art image of a red and white stripped shrimp.">
        <img src="images/9_Blue_Jelly.png" alt="A pixel art image of a bright blue shrimp.">
        <img src="images/10_Orange_Rili.png" alt="A pixel art image of a orange and white stripped shrimp.">
        <img src="images/11_Snowball.png" alt="A pixel art image of a white shrimp.">
        <img src="images/12_Extreme Black.png" alt="A pixel art image of a black shrimp.">
    </section>

    <!-- START Contact Form -->
    <section class="wrapper">
        <form>
            <label>Please write your name</label>
            <input type="text" required placeholder="Your Name">
            
            
            <label>Your Email</label>
            <input type="email" required placeholder="Your Email">

            <label>We want to hear your thoughts!</label>
            <textarea rows="20"></textarea>

            <label>How did you hear about us?</label>
            <select>
                <option>Choose One</option>
                <optgroup label="Social Media">
                <option>Instagram</option>
                <option>Twitter</option>
                <option>Bluesky</option>
                <option>TikTok</option>
                </optgroup>
                <optgroup label="Other">
                <option>Friend</option>
                <option>Searching</option>
                </optgroup>
            </select>

            <button>Submit</button>

        </form>
        <!-- END Contact Form -->

    </section>
</body>
</html>
